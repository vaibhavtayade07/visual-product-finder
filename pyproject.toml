[project]
name = "visual-product-finder"
version = "0.1.0"
description = "Show Us What You Want - visual product search MVP (FastAPI + Postgres/pgvector)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastembed>=0.9.0",
]

[project.optional-dependencies]
# Real-provider extras. Mock mode runs keyless without these.
cloud = [
    "google-auth>=2.30",   # Vertex AI access-token minting from service-account JSON
    "boto3>=1.34",         # Amazon Titan Multimodal Embeddings + Cloudflare R2 (S3 API)
]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
